[package]
name = "ui"
description = "egui app with pretty and debug views of the traffic simulation."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.37.0"
glam.workspace = true
oxc = { version = "0.160", features = ["transformer", "codegen", "semantic"] }
rquickjs = { version = "0.14.0", features = ["macro"] }
serde = "1.0.229"
serde_json.workspace = true
traffic-network = { workspace = true, features = ["serde"] }
traffic-sim = { workspace = true, features = ["serde"] }
