[workspace]
resolver = "3"
members = ["sim", "network", "ui"]

[workspace.package]
version = "0.0.0"
authors = ["Alexander Rafferty <hello@alexanderrafferty.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rafferty97/traffic-simple"

[workspace.dependencies]
traffic-sim = { path = "sim" }
traffic-network = { path = "network" }
glam = "0.34.3"
rand = { version = "0.10.3", default-features = false }
# For freeze-frame snapshots. `float_roundtrip` so f64s read back exactly.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

# The UI runs from a dev build, and the simulation and its geometry are too slow
# unoptimised: some optimisation for the workspace, keeping builds quick, and
# full optimisation for dependencies, which rarely rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# One codegen unit, so the simulation's hot paths inline across modules, and
# thin LTO across crates, for slower release builds: against the defaults, a
# step on the busy 10,000-vehicle ring takes about 45% less time, and on the
# 10,000-vehicle city grid about 13% less. Benchmarks inherit it.
[profile.release]
codegen-units = 1
lto = "thin"

# Release, with debug symbols, so profilers name functions and lines, and
# inlined functions where they can: `cargo bench --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
