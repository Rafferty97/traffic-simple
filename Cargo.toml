[workspace]
resolver = "3"
members = ["sim", "ui"]

[workspace.package]
version = "0.0.0"
authors = ["Alexander Rafferty <hello@alexanderrafferty.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rafferty97/traffic-simple"

[workspace.dependencies]
traffic-sim = { path = "sim" }
glam = "0.34.3"
rand = { version = "0.10.3", default-features = false }
# For freeze-frame snapshots. `float_roundtrip` so f64s read back exactly.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
